[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gisc"
version = "0.3.1"
description = "A stateless civil/GIS compiler: civil intent -> IR -> adapters -> view + provenance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Flynn", email = "michaelbflynn@gmail.com" }]
keywords = [
  "civil-engineering", "landxml", "gis", "alignment", "stationing",
  "civil3d", "surveying", "geospatial", "provenance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Operating System :: OS Independent",
]
dependencies = [
  "typer>=0.12",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/mf4633/gisc"
Repository = "https://github.com/mf4633/gisc"
Issues = "https://github.com/mf4633/gisc/issues"
Changelog = "https://github.com/mf4633/gisc/releases"

[project.scripts]
gisc = "gisc.cli:main"

[tool.setuptools.packages.find]
include = ["gisc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "civil3d: compares gisc against artifacts captured from Autodesk Civil 3D",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
